name: Publish to Thunderstore

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency: thunderstore

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern "DeepNorthCompat-*.zip" --dir dist
      - name: Validate it against the tagged sources
        run: python -B scripts/validate-package.py --release-tag "$TAG"
      - name: Upload to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: python -B scripts/publish-thunderstore.py
